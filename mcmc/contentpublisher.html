<!doctype html>
<html lang="ms">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MCMC Content Publisher | SEBENARNYA.MY</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/webp" href="../image/icon.png">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../admin.css">
</head>

<body class="admin-body">
    <div class="adm">
        <!-- ===== Sidebar ===== -->
        <aside class="adm-side">
            <div class="adm-brand">
                <img src="../image/icon.png" alt="">
                <div>
                    <b>sebenarnya.my</b>
                    <small>Portal Content Publisher</small>
                </div>
            </div>

            <nav class="adm-nav" aria-label="Navigasi publisher">
                <a href="#ready" data-view="ready">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M4 20h16" />
                        <path d="M12 16V4" />
                        <path d="M7 9l5-5 5 5" />
                    </svg>
                    Sedia diterbitkan
                    <span class="nav-badge" id="nav-ready" title="Kandungan menunggu penerbitan"></span>
                </a>
                <a href="#scheduled" data-view="scheduled">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <rect x="3" y="5" width="18" height="16" rx="2" />
                        <path d="M3 10h18M8 3v4M16 3v4" />
                    </svg>
                    Dijadualkan
                    <span class="nav-badge muted" id="nav-scheduled" title="Penerbitan berjadual"></span>
                </a>
                <a href="#published" data-view="published">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M20 6L9 17l-5-5" />
                    </svg>
                    Diterbitkan
                </a>
                <a href="#site" data-view="site">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <circle cx="12" cy="12" r="9" />
                        <path d="M3 12h18M12 3a14 14 0 010 18M12 3a14 14 0 000 18" />
                    </svg>
                    Laman awam
                </a>
                <a href="#info" data-view="info">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M4 5a2 2 0 012-2h9l5 5v11a2 2 0 01-2 2H6a2 2 0 01-2-2z" />
                        <path d="M14 3v5h5M8 13h8M8 17h5" />
                    </svg>
                    Info &amp; Panduan
                </a>
                <a href="#activity" data-view="activity">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M12 8v4l3 2" />
                        <circle cx="12" cy="12" r="9" />
                    </svg>
                    Log aktiviti
                </a>
                <a href="#account" data-view="account">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <circle cx="12" cy="8" r="4" />
                        <path d="M4 21a8 8 0 0116 0" />
                    </svg>
                    Akaun saya
                </a>
            </nav>

            <div class="adm-side-foot">
                <div class="adm-user">
                    <span class="avatar" id="me-avatar"></span>
                    <div>
                        <b>MCMC Content Publisher</b>
                        <span id="me-email"></span>
                    </div>
                </div>
                <a href="../index.html" class="side-link" target="_blank" rel="noopener">Lihat laman awam ↗</a>
                <button id="reset-demo" title="Kembalikan semua kes demo kepada keadaan asal">Tetapkan semula demo</button>
                <button id="logout" class="logout">Log keluar</button>
            </div>
        </aside>

        <!-- ===== Main ===== -->
        <div class="adm-main">
            <header class="adm-top">
                <div>
                    <div class="crumb" id="crumb">MCMC Content Publisher</div>
                    <h1 id="page-title">Sedia diterbitkan</h1>
                </div>
                <span class="spacer" style="flex:1"></span>
                <div class="bell-wrap">
                    <button class="bell" id="bell" aria-label="Notifikasi">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 8a6 6 0 00-12 0c0 7-3 9-3 9h18s-3-2-3-9" />
                            <path d="M13.7 21a2 2 0 01-3.4 0" />
                        </svg>
                        <span class="bell-count" id="bell-count"></span>
                    </button>
                    <div class="bell-panel" id="bell-panel" hidden></div>
                </div>
                <label class="search">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                        stroke-linecap="round">
                        <circle cx="11" cy="11" r="7" />
                        <path d="M20 20l-3.5-3.5" />
                    </svg>
                    <input id="global-q" type="search" placeholder="Cari ID kes atau tajuk…" autocomplete="off">
                </label>
            </header>

            <main class="adm-content">
                <section class="adm-view" id="view-ready" data-view="ready"></section>
                <section class="adm-view" id="view-scheduled" data-view="scheduled" hidden></section>
                <section class="adm-view" id="view-published" data-view="published" hidden></section>
                <section class="adm-view" id="view-case" data-view="case" hidden></section>
                <section class="adm-view" id="view-site" data-view="site" hidden></section>
                <section class="adm-view" id="view-story" data-view="story" hidden></section>
                <section class="adm-view" id="view-info" data-view="info" hidden></section>
                <section class="adm-view" id="view-guide" data-view="guide" hidden></section>
                <section class="adm-view" id="view-activity" data-view="activity" hidden></section>
                <section class="adm-view" id="view-account" data-view="account" hidden></section>
            </main>
        </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="../storydata.js"></script>
    <script src="../cases.js"></script>
    <script src="../users.js"></script>
    <script src="staff.js"></script>
    <script src="bell.js"></script>
    <script src="../infocontent.js"></script>
    <script src="infoeditor.js"></script>
    <script src="sitemanager.js"></script>
    <script src="contentpublisher.js"></script>
</body>

</html>
